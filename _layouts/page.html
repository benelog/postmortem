---
layout: default
---
<article class="episode page">
  <header class="episode-header">
    <p class="episode-number">{{ page.kicker }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="episode-meta">{{ page.summary }}</p>{% endif %}
  </header>
  {{ content }}
</article>
<nav class="episode-nav">
  <span></span>
  <a class="index" href="{{ '/' | relative_url }}">목차</a>
  <span></span>
</nav>
