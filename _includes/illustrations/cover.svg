<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="비 내리는 밤, 불 켜진 술집 유리문">
  <defs>
    <linearGradient id="cv-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c27b" stop-opacity=".95"/>
      <stop offset="1" stop-color="#e07a5f" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="cv-halo" cx=".5" cy=".55" r=".6">
      <stop offset="0" stop-color="#f2c27b" stop-opacity=".28"/>
      <stop offset="1" stop-color="#f2c27b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="#14161c"/>
  <!-- rain -->
  <g stroke="#e6e2da" stroke-opacity=".12" stroke-width="1.2">
    <line x1="60" y1="20" x2="40" y2="80"/><line x1="140" y1="60" x2="120" y2="120"/><line x1="230" y1="10" x2="210" y2="70"/>
    <line x1="320" y1="90" x2="300" y2="150"/><line x1="90" y1="200" x2="70" y2="260"/><line x1="200" y1="240" x2="180" y2="300"/>
    <line x1="290" y1="330" x2="270" y2="390"/><line x1="380" y1="20" x2="360" y2="80"/><line x1="470" y1="120" x2="450" y2="180"/>
    <line x1="720" y1="40" x2="700" y2="100"/><line x1="770" y1="260" x2="750" y2="320"/><line x1="40" y1="360" x2="20" y2="420"/>
    <line x1="440" y1="300" x2="420" y2="360"/><line x1="160" y1="400" x2="140" y2="450"/><line x1="760" y1="140" x2="740" y2="200"/>
  </g>
  <!-- ground and halo -->
  <rect x="0" y="400" width="800" height="50" fill="#0f1116"/>
  <ellipse cx="610" cy="402" rx="190" ry="40" fill="url(#cv-halo)"/>
  <!-- door -->
  <rect x="520" y="110" width="180" height="290" rx="4" fill="url(#cv-glow)"/>
  <rect x="520" y="110" width="180" height="290" rx="4" fill="none" stroke="#e6e2da" stroke-opacity=".6" stroke-width="3"/>
  <line x1="610" y1="110" x2="610" y2="400" stroke="#14161c" stroke-opacity=".7" stroke-width="4"/>
  <line x1="520" y1="255" x2="700" y2="255" stroke="#14161c" stroke-opacity=".5" stroke-width="3"/>
  <rect x="592" y="240" width="8" height="40" rx="3" fill="#14161c" fill-opacity=".8"/>
  <!-- silhouettes inside -->
  <g fill="#14161c" fill-opacity=".55">
    <circle cx="560" cy="300" r="12"/><rect x="546" y="312" width="28" height="60" rx="8"/>
    <circle cx="660" cy="296" r="12"/><rect x="646" y="308" width="28" height="64" rx="8"/>
    <rect x="575" y="340" width="70" height="6" rx="2"/>
  </g>
  <!-- sign -->
  <rect x="540" y="60" width="140" height="34" rx="3" fill="none" stroke="#e07a5f" stroke-width="2"/>
  <text x="610" y="84" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#e07a5f" letter-spacing="6">24H</text>
  <!-- title -->
  <text x="60" y="190" font-family="'Noto Serif KR', serif" font-size="64" font-weight="600" fill="#e6e2da" letter-spacing="6">포스트모템</text>
  <text x="62" y="232" font-family="'Noto Serif KR', serif" font-size="17" fill="#9a968f" letter-spacing="1">IT 회사의 장애를 둘러싼 연작 추리 단편</text>
  <line x1="62" y1="256" x2="420" y2="256" stroke="#e07a5f" stroke-width="2"/>
  <text x="62" y="300" font-family="ui-monospace, monospace" font-size="13" fill="#7aa2c7">02:14:07  [SEV1] payments-api 5xx 43%</text>
  <text x="62" y="322" font-family="ui-monospace, monospace" font-size="13" fill="#7aa2c7" fill-opacity=".6">02:14:48  ack · han.yuri · 41s</text>
  <text x="62" y="344" font-family="ui-monospace, monospace" font-size="13" fill="#7aa2c7" fill-opacity=".35">02:17:03  "플래그 확인해볼게요"</text>
</svg>
