<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="계정 한도선을 뚫고 올라간 막대 하나와 굶는 작은 막대들">
  <rect width="800" height="450" fill="#14161c"/>
  <text x="740" y="110" text-anchor="end" font-family="'Noto Serif KR', serif" font-size="96" font-weight="600" fill="#e07a5f" fill-opacity=".9">429</text>
  <text x="740" y="140" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" fill="#e6e2da" fill-opacity=".45">Too Many Requests</text>
  <!-- axis -->
  <line x1="80" y1="380" x2="560" y2="380" stroke="#e6e2da" stroke-opacity=".3" stroke-width="1.5"/>
  <!-- limit line -->
  <line x1="80" y1="300" x2="560" y2="300" stroke="#e07a5f" stroke-dasharray="6 6" stroke-width="1.5"/>
  <text x="556" y="292" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#e07a5f">account limit 1,000/s</text>
  <!-- big bar -->
  <rect x="120" y="60" width="90" height="320" fill="#7aa2c7" fill-opacity=".85"/>
  <rect x="120" y="60" width="90" height="240" fill="#e07a5f" fill-opacity=".55"/>
  <text x="165" y="404" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#e6e2da" fill-opacity=".7">atlas-gateway</text>
  <text x="165" y="50" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#7aa2c7">4,500</text>
  <!-- small bars -->
  <g fill="#7aa2c7" fill-opacity=".35">
    <rect x="280" y="368" width="50" height="12"/><rect x="370" y="371" width="50" height="9"/><rect x="460" y="373" width="50" height="7"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="10" fill="#e6e2da" fill-opacity=".45" text-anchor="middle">
    <text x="305" y="404">payments</text><text x="395" y="404">coupon</text><text x="485" y="404">settlement</text>
  </g>
  <!-- phone line -->
  <path d="M600 330 q60-60 120 0" fill="none" stroke="#e6e2da" stroke-opacity=".3" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle cx="600" cy="330" r="5" fill="#e6e2da" fill-opacity=".5"/><circle cx="720" cy="330" r="5" fill="#e6e2da" fill-opacity=".5"/>
  <text x="660" y="360" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#e6e2da" fill-opacity=".45">14:19 · 30초만요</text>
</svg>
