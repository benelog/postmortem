<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="승인 실패를 출력한 카드 단말기와 네 개의 잔">
  <rect width="800" height="450" fill="#14161c"/>
  <!-- clock -->
  <circle cx="640" cy="130" r="70" fill="none" stroke="#e6e2da" stroke-opacity=".35" stroke-width="2"/>
  <g stroke="#e6e2da" stroke-opacity=".35" stroke-width="2">
    <line x1="640" y1="64" x2="640" y2="72"/><line x1="706" y1="130" x2="698" y2="130"/><line x1="640" y1="196" x2="640" y2="188"/><line x1="574" y1="130" x2="582" y2="130"/>
  </g>
  <line x1="640" y1="130" x2="640" y2="82" stroke="#e6e2da" stroke-width="3" stroke-linecap="round"/>
  <line x1="640" y1="130" x2="600" y2="76" stroke="#e07a5f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="640" cy="130" r="4" fill="#e6e2da"/>
  <text x="640" y="230" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#e6e2da" fill-opacity=".5">23:50:12</text>
  <!-- receipt -->
  <path d="M170 60 h150 v150 l-10 8 l-10-8 l-10 8 l-10-8 l-10 8 l-10-8 l-10 8 l-10-8 l-10 8 l-10-8 l-10 8 l-10-8 l-10 8 l-10-8 l-10 8 l-10-8 Z" fill="#e6e2da" fill-opacity=".92"/>
  <g font-family="ui-monospace, monospace" font-size="11" fill="#14161c" fill-opacity=".55">
    <text x="190" y="88">2027-05-13 23:51</text>
    <text x="190" y="106">POS  ****-4471</text>
    <text x="190" y="124">금액   24,000</text>
  </g>
  <text x="245" y="170" text-anchor="middle" font-family="'Noto Serif KR', serif" font-size="20" font-weight="600" fill="#8a3b2b">승인 실패</text>
  <text x="245" y="190" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#14161c" fill-opacity=".5">cert expired</text>
  <!-- terminal -->
  <rect x="160" y="215" width="170" height="110" rx="10" fill="#0f1116" stroke="#e6e2da" stroke-opacity=".6" stroke-width="2"/>
  <rect x="178" y="230" width="134" height="30" rx="3" fill="#7aa2c7" fill-opacity=".25"/>
  <g fill="#e6e2da" fill-opacity=".4">
    <circle cx="200" cy="283" r="5"/><circle cx="225" cy="283" r="5"/><circle cx="250" cy="283" r="5"/><circle cx="275" cy="283" r="5"/>
    <circle cx="200" cy="305" r="5"/><circle cx="225" cy="305" r="5"/><circle cx="250" cy="305" r="5"/><circle cx="275" cy="305" r="5" fill="#e07a5f" fill-opacity=".9"/>
  </g>
  <!-- table with 4 glasses -->
  <rect x="80" y="380" width="640" height="8" rx="3" fill="#e6e2da" fill-opacity=".6"/>
  <g fill="none" stroke="#e6e2da" stroke-width="2.5">
    <path d="M400 380 l5-32 h30 l5 32 Z"/><path d="M470 380 l5-32 h30 l5 32 Z"/><path d="M540 380 l5-32 h30 l5 32 Z"/><path d="M610 380 l5-32 h30 l5 32 Z"/>
