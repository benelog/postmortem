title: 포스트모템
description: IT 회사의 장애를 둘러싼 연작 추리 단편
lang: ko
url: "https://benelog.github.io"
baseurl: "/postmortem"
collections:
  episodes:
    output: true
    permalink: /:name/
defaults:
